nodeLinker: node-modules

enableStrictSettings: true
enableTelemetry: false

logFilters:
  - code: YN0002
    level: error
  - code: YN0060
    level: error
  - code: YN0086
    level: error

# Next's ESLint plugin consumes a package with an ESLint peer but does not
# declare the peer itself. Supplying the missing declaration keeps Yarn's
# peer validation strict without bypassing it.
packageExtensions:
  "@next/eslint-plugin-next@*":
    peerDependencies:
      eslint: "*"
